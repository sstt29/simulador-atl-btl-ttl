<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="./manifest.webmanifest"><title>Simulador ATL · BTL · TTL</title>
<style>html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:620px}.spin{width:46px;height:46px;border:5px solid #31405f;border-top-color:#6ee7f9;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#aeb9cf}</style></head>
<body><div class="load"><div class="box"><div class="spin"></div><h1>ATL · BTL · TTL</h1><p>Iniciando simulador…</p><small>La primera carga prepara también el uso sin conexión.</small></div></div>
<script>
(async()=>{try{
 const names=['payload0.txt','payload1.txt','payload2.txt','payload3.txt','payload4.txt'];
 const parts=await Promise.all(names.map(n=>fetch('./'+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));
 const b64=parts.join('').replace(/\s/g,''); const raw=atob(b64); const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
 if(!('DecompressionStream' in window))throw new Error('Este navegador necesita una versión más reciente.');
 const ds=new DecompressionStream('gzip'); const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
 document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div class="load"><div class="box"><h1>No se pudo iniciar</h1><p>Actualice el navegador y vuelva a abrir el simulador.</p><small>'+String(e.message||e)+'</small></div></div>'}
})();
</script></body></html>
